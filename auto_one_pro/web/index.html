<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/auto_one_pro/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="auto_one">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-512-new.png"/>

  <title>auto_one</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    شاشة تحميل بسيطة بهوية أوتو ون، بتظهر فورًا (HTML عادي، مش
    محتاجة تستنى Flutter يحمّل)، وبتختفي لوحدها أوتوماتيك لما
    الموقع الحقيقي يبقى جاهز (حدث flutter-first-frame).
  -->
  <style>
    #auto-one-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    #auto-one-loading img {
      width: 120px;
      height: auto;
      animation: auto-one-pulse 1.4s ease-in-out infinite;
    }
    #auto-one-loading .auto-one-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(225, 29, 42, 0.15);
      border-top-color: #E11D2A;
      border-radius: 50%;
      animation: auto-one-spin 0.8s linear infinite;
    }
    @keyframes auto-one-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes auto-one-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    #auto-one-loading.auto-one-hide {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease-out;
    }
  </style>

  <div id="auto-one-loading">
    <img src="icons/Icon-512-new.png" alt="AUTO ONE" />
    <div class="auto-one-spinner"></div>
  </div>

  <script>
    // لما فلاتر يخلّص أول رسمة فعلية (يبقى جاهز)، نخفي شاشة
    // التحميل دي بنعومة بدل ما تختفي فجأة.
    window.addEventListener('flutter-first-frame', function () {
      var loadingEl = document.getElementById('auto-one-loading');
      if (!loadingEl) return;
      loadingEl.classList.add('auto-one-hide');
      setTimeout(function () {
        loadingEl.remove();
      }, 400);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    مؤجَّلين (defer) عشان ما يوقفوش ظهور الصفحة الأول: المتصفح بيكمل
    يبني الصفحة عادي وبيحمّلهم في الخلفية، وينفّذهم بعد ما الـ HTML
    يخلص تحليل بدل ما يقف عندهم الأول (كانوا سبب "Render-blocking
    requests" في تقرير Lighthouse).
  -->

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js" defer></script>
</body>
</html>
